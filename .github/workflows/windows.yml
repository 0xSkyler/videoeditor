name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Get pinned FFmpeg from verified StudioCut v0.2.0 build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v0.2.0 --repo "$env:GITHUB_REPOSITORY" --pattern 'StudioCut-win-x64.zip' --dir bootstrap
          Expand-Archive bootstrap/StudioCut-win-x64.zip -DestinationPath bootstrap-unpacked
          New-Item -ItemType Directory -Force -Path StudioCut/tools | Out-Null
          Copy-Item bootstrap-unpacked/tools/ffmpeg.exe StudioCut/tools/ffmpeg.exe
          Copy-Item bootstrap-unpacked/tools/ffprobe.exe StudioCut/tools/ffprobe.exe
          if (Test-Path bootstrap-unpacked/tools/FFmpeg-LICENSE.txt) { Copy-Item bootstrap-unpacked/tools/FFmpeg-LICENSE.txt StudioCut/tools/FFmpeg-LICENSE.txt }
          if (Test-Path bootstrap-unpacked/tools/GPL-3.0.txt) { Copy-Item bootstrap-unpacked/tools/GPL-3.0.txt StudioCut/tools/GPL-3.0.txt }
          if (-not (Test-Path StudioCut/tools/GPL-3.0.txt)) { throw 'Pinned FFmpeg package is missing its GPL-3.0 license text.' }
      - name: Make FFmpeg available to tests
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path StudioCut/tools).Path
      - name: Repeated integration and validation tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath dotnet -ArgumentList 'run --project StudioCut.Tests/StudioCut.Tests.csproj -c Release' -PassThru -NoNewWindow -RedirectStandardOutput test-out.log -RedirectStandardError test-err.log
          $finished = $p.WaitForExit(150000)
          if (-not $finished) { taskkill /PID $p.Id /T /F | Out-Null }
          Get-Content test-out.log
          Get-Content test-err.log
          if (-not $finished) { throw 'Tests exceeded 150-second limit; see logs above for last completed step.' }
          if ($p.ExitCode -ne 0) { throw "Regression tests failed with exit code $($p.ExitCode)" }
      - name: WPF user-journey acceptance test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath dotnet -ArgumentList 'run --project StudioCut.GuiTests/StudioCut.GuiTests.csproj -c Release' -PassThru -NoNewWindow -RedirectStandardOutput gui-out.log -RedirectStandardError gui-err.log
          $finished = $p.WaitForExit(150000)
          if (-not $finished) { taskkill /PID $p.Id /T /F | Out-Null }
          Get-Content gui-out.log
          Get-Content gui-err.log
          if (-not $finished) { throw 'WPF user-workflow test exceeded 150 seconds' }
          if ($p.ExitCode -ne 0) { throw "WPF GUI acceptance failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StudioCut-user-acceptance
          path: |
            ux-results/
            gui-out.log
            gui-err.log
          if-no-files-found: warn
      - name: Publish self-contained Windows application
        run: dotnet publish StudioCut/StudioCut.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist
      - name: Copy media tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/tools | Out-Null
          Copy-Item StudioCut/tools/*.exe dist/tools/
          if (Test-Path StudioCut/tools/FFmpeg-LICENSE.txt) { Copy-Item StudioCut/tools/FFmpeg-LICENSE.txt dist/tools/ }
          Copy-Item StudioCut/tools/GPL-3.0.txt dist/tools/
          Copy-Item THIRD_PARTY_NOTICES.md dist/
      - name: Test packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist/StudioCut.exe)) { throw 'Executable missing' }
          if (-not (Test-Path dist/tools/ffprobe.exe)) { throw 'ffprobe missing' }
          & dist/tools/ffmpeg.exe -version | Select-Object -First 1
          $app = Start-Process -FilePath (Resolve-Path dist/StudioCut.exe).Path -PassThru
          try {
            Start-Sleep -Seconds 4
            $app.Refresh()
            if ($app.HasExited) { throw "Portable StudioCut.exe quit unexpectedly (exit $($app.ExitCode))." }
            Write-Host ("Packaged StudioCut.exe launched successfully; working set {0:N1} MB" -f ($app.WorkingSet64 / 1MB))
          }
          finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath StudioCut-win-x64.zip
      - name: Verify release ZIP contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive StudioCut-win-x64.zip -DestinationPath release-integrity
          foreach ($required in @('StudioCut.exe','tools/ffmpeg.exe','tools/ffprobe.exe','tools/GPL-3.0.txt','THIRD_PARTY_NOTICES.md')) {
            if (-not (Test-Path (Join-Path 'release-integrity' $required))) { throw "Archive missing $required" }
          }
          Write-Host "Verified package components and ZIP extraction."
          Get-FileHash StudioCut-win-x64.zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: StudioCut-win-x64
          path: StudioCut-win-x64.zip
      - name: Publish verified GitHub Release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.3.0 StudioCut-win-x64.zip --target $env:GITHUB_SHA --title 'StudioCut v0.3.0' --notes 'Windows x64 editor with WPF GUI user-workflow tests, on-demand edited still preview, trimmed/cropped source-reset safety, audio mixing/music delay, captions, and exported-file verification. Extract ZIP and run StudioCut.exe. Includes FFmpeg/FFprobe and third-party notices.'
