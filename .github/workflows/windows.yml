name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Get FFmpeg binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          New-Item -ItemType Directory -Force -Path StudioCut/tools | Out-Null
          Get-ChildItem -Path ffmpeg-unpacked -Filter ffmpeg.exe -Recurse | Select-Object -First 1 | Copy-Item -Destination StudioCut/tools/ffmpeg.exe
          Get-ChildItem -Path ffmpeg-unpacked -Filter ffprobe.exe -Recurse | Select-Object -First 1 | Copy-Item -Destination StudioCut/tools/ffprobe.exe
      - name: Publish
        run: dotnet publish StudioCut/StudioCut.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist
      - name: Copy media tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/tools | Out-Null
          Copy-Item StudioCut/tools/*.exe dist/tools/
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath StudioCut-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StudioCut-win-x64
          path: StudioCut-win-x64.zip
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME StudioCut-win-x64.zip --title "StudioCut $env:GITHUB_REF_NAME" --notes "Portable Windows x64 build."
