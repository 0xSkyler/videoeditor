name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Get FFmpeg binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          New-Item -ItemType Directory -Force -Path StudioCut/tools | Out-Null
          Get-ChildItem -Path ffmpeg-unpacked -Filter ffmpeg.exe -Recurse | Select-Object -First 1 | Copy-Item -Destination StudioCut/tools/ffmpeg.exe
          Get-ChildItem -Path ffmpeg-unpacked -Filter ffprobe.exe -Recurse | Select-Object -First 1 | Copy-Item -Destination StudioCut/tools/ffprobe.exe
          $license = Get-ChildItem -Path ffmpeg-unpacked -File -Recurse | Where-Object { $_.Name -like 'LICENSE*' -or $_.Name -like 'COPYING*' } | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName -Destination StudioCut/tools/FFmpeg-LICENSE.txt }
          Invoke-WebRequest 'https://www.gnu.org/licenses/gpl-3.0.txt' -OutFile StudioCut/tools/GPL-3.0.txt
      - name: Make FFmpeg available to tests
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path StudioCut/tools).Path
      - name: Repeated integration and validation tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath dotnet -ArgumentList 'run --project StudioCut.Tests/StudioCut.Tests.csproj -c Release' -PassThru -NoNewWindow -RedirectStandardOutput test-out.log -RedirectStandardError test-err.log
          $finished = $p.WaitForExit(150000)
          if (-not $finished) { taskkill /PID $p.Id /T /F | Out-Null }
          Get-Content test-out.log
          Get-Content test-err.log
          if (-not $finished) { throw 'Tests exceeded 150-second limit; see logs above for last completed step.' }
          if ($p.ExitCode -ne 0) { throw "Regression tests failed with exit code $($p.ExitCode)" }
      - name: Publish self-contained Windows application
        run: dotnet publish StudioCut/StudioCut.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist
      - name: Copy media tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/tools | Out-Null
          Copy-Item StudioCut/tools/*.exe dist/tools/
          if (Test-Path StudioCut/tools/FFmpeg-LICENSE.txt) { Copy-Item StudioCut/tools/FFmpeg-LICENSE.txt dist/tools/ }
          Copy-Item StudioCut/tools/GPL-3.0.txt dist/tools/
          Copy-Item THIRD_PARTY_NOTICES.md dist/
      - name: Test packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist/StudioCut.exe)) { throw 'Executable missing' }
          if (-not (Test-Path dist/tools/ffprobe.exe)) { throw 'ffprobe missing' }
          & dist/tools/ffmpeg.exe -version | Select-Object -First 1
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath StudioCut-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StudioCut-win-x64
          path: StudioCut-win-x64.zip
      - name: Publish verified GitHub Release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.2.0 StudioCut-win-x64.zip --target $env:GITHUB_SHA --title 'StudioCut v0.2.0' --notes 'Portable Windows x64 editor. Verified with automated .NET/WPF compilation, 77 assertions, 7 Windows FFmpeg media exports, and a ZIP integrity check. Includes FFmpeg/FFprobe and third-party notices. Extract and run StudioCut.exe.'
